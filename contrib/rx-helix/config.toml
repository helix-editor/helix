# rx-helix sample configuration
#
# Copy this file to ~/.config/helix/config.toml:
#
#   mkdir -p ~/.config/helix
#   cp contrib/rx-helix/config.toml ~/.config/helix/config.toml
#
# Modular config: extra keymaps and overrides live in `config.d/*.toml`.
# All `~/.config/helix/config.d/*.toml` are merged alphabetically on top of
# this file. The Vim muscle-memory module is at:
#
#   mkdir -p ~/.config/helix/config.d
#   cp contrib/rx-helix/config.d/vim.toml ~/.config/helix/config.d/vim.toml
#   cp contrib/config.d/vim.toml ~/.config/helix/config.d/vim.toml  # vanilla helix-vim
#
# Noctalia/matugen users should also install the rx-theme child theme:
#
#   cp contrib/themes/rx-theme.toml ~/.config/helix/themes/rx-theme.toml
#   cp contrib/rx-helix/config.d/99-theme.toml ~/.config/helix/config.d/99-theme.toml
#
# The fork features only appear when the relevant sections are present. In
# particular the dashboard needs `enable = true`.
#
# Theme scopes used by this config are described in docs/CUSTOMIZATION.md.

[editor]
# Color the mode chip per mode. Without this the chips are plain text.
color-modes = true
# Highlight the current line(s).
cursorline = true
# Matches the default; set to "always" for a permanent bufferline.
bufferline = "multiple"
# Keep completion/hover/menu panels on the terminal background.
transparent-popups = true
# Draw themed borders around hover, completion, signature, and menu popups.
popup-border = "all"

[editor.cursor-shape]
# "block" is drawn entirely by Helix. "block-hardware" keeps the terminal
# cursor visible on top of it, which enables terminal effects such as Kitty's
# cursor_trail. Bar/underline always use the terminal cursor.
normal = "block-hardware"
insert = "bar"
select = "underline"

[editor.statusline]
left = [
  "mode",
  "spacer",
  "version-control",
  "diagnostics",
  "spinner",
  "file-name",
]
center = []
right = ["position", "file-type", "file-line-ending", "total-line-numbers"]

separator = "│"

# Keep the statusline itself transparent in the middle; modules at the edges
# stay opaque.
transparent = ["center"]

# Do not reserve blank cells for an idle spinner / unmodified buffer.
reserve-space = false

# Paint the position with the current mode colors.
accent = ["position"]

# Use the short labels at or below this many columns.
mode-short-width = 100

mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"
mode.select-prompt = "SELECT"
mode.command = "COMMAND"
mode.search = "SEARCH"

mode.normal-short = "NOR"
mode.insert-short = "INS"
mode.select-short = "SEL"
mode.select-prompt-short = "SEL"
mode.command-short = "COM"
mode.search-short = "S"

[editor.dashboard]
enable = true

# auto = vertical or horizontal depending on the terminal size.
# The layout is recomputed on resize; no restart is needed.
layout = "auto"
align = "center"
vertical-align = "center"
section-gap = 1
item-gap = 1

# space-between: description left, keys right-aligned in a content-sized block.
# Set menu-width to a positive value for a fixed-width block.
# key-left: key left-aligned to key-width, then the description.
menu-style = "space-between"
menu-width = 0
key-width = 16
column-gap = 8

# Use the built-in logo when header/header-file are empty.
default-logo = true

# Optional: override the built-in logo.
# header = """
#   your ascii art
# """
# header-file = "~/.config/helix/logo.txt"

# Gap between descriptions and keys, per layout.
[editor.dashboard.menu-gap]
vertical = 48
horizontal = 38

# Each item runs any Helix command name (file_picker) or ex-command (:new).
# Omit `action` for a static, informational row.
# Icons are optional and need a Nerd Font to render.

[[editor.dashboard.items]]
key = "f"
desc = "Find File"
action = "file_picker"

[[editor.dashboard.items]]
key = "n"
desc = "New File"
action = ":new"

[[editor.dashboard.items]]
key = "g"
desc = "Find Text"
action = "global_search"

[[editor.dashboard.items]]
key = "r"
desc = "Buffers"
action = "buffer_picker"

[[editor.dashboard.items]]
key = "c"
desc = "Config"
action = ":config-open"

[[editor.dashboard.items]]
key = "q"
desc = "Quit"
action = ":quit"

# Optional display-only markdown rendering.
[editor.markdown]
render = true
images = true

# Built-in spell checking for Markdown, plain text and similar prose files.
# Requires hunspell; navigate with [s / ]s, suggest with z=.
[editor.spellcheck]
enable = true
language = "en_US"
