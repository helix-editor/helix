# Merge these into ~/.config/helix/themes/<your-theme>.toml.
# Palette names depend on your theme; the values below assume the noctalia
# palette used by RX-Helix.
#
# If your theme is generated by matugen/Noctalia, add these to the generator
# template so they survive regeneration.

"ui.dashboard.header" = { fg = "primary", modifiers = ["bold"] }
"ui.dashboard.subtitle" = { fg = "onSurfaceVariant" }
"ui.dashboard.item" = { fg = "onSurface" }
"ui.dashboard.icon" = { fg = "primary" }
"ui.dashboard.key" = { fg = "onSurfaceVariant" }
"ui.dashboard.footer" = { fg = "onSurfaceVariant" }

"ui.dashboard.logo.purple" = { fg = "primary" }
"ui.dashboard.logo.purple-dark" = { fg = "onSurfaceVariant" }
"ui.dashboard.logo.blue" = { fg = "tertiary" }
"ui.dashboard.logo.blue-dark" = { fg = "outline" }
