# rx-helix theme add-on for the generated Noctalia Helix theme.
#
# The live `noctalia.toml` is regenerated by matugen on every wallpaper
# change, so never edit it directly. This child theme inherits its palette
# and only overrides scope mappings to match the Neovim/base16 setup.
#
# Install:
#   cp contrib/themes/rx-theme.toml ~/.config/helix/themes/rx-theme.toml
#   printf 'theme = "rx-theme"\n' > ~/.config/helix/config.d/99-theme.toml
#
# The config.d module keeps the active theme set to rx-theme even when
# Noctalia rewrites the main config.toml back to `theme = "noctalia"`.

inherits = "noctalia"

# Base16 syntax semantics, resolved through Noctalia's dynamic palette.
"attribute" = { fg = "secondary", modifiers = ["bold"] }
"type" = "secondary"
"type.builtin" = { fg = "secondary", modifiers = ["italic"] }
"type.enum.variant" = "secondary"

"constructor" = "primary"

"constant" = "tertiary"
"constant.builtin" = { fg = "tertiary", modifiers = ["italic"] }
"constant.character" = "error"
"constant.character.escape" = "tertiary"
"constant.numeric" = "tertiary"

"string" = "primary"
"string.regexp" = "tertiary"
"string.special" = "onSurfaceVariant"
"string.special.symbol" = "primary"
"string.special.path" = { fg = "tertiary", underline = { color = "tertiary", style = "line" } }
"path" = { fg = "tertiary", underline = { color = "tertiary", style = "line" } }

"comment" = { fg = "outline", modifiers = ["italic"] }

"variable" = "error"
"variable.builtin" = { fg = "error", modifiers = ["italic"] }
"variable.parameter" = "onSurface"
"variable.other.member" = "onSurface"
"property" = { fg = "tertiary", modifiers = ["bold"] }

"label" = "secondary"
"punctuation" = "onSurface"
"punctuation.delimiter" = "onSurfaceVariant"
"punctuation.special" = "onSurfaceVariant"

"operator" = "onSurface"
"keyword" = "secondary"
"keyword.control.conditional" = "secondary"
"keyword.directive" = "secondary"

"function" = "primary"
"function.builtin" = { fg = "primary", modifiers = ["italic"] }
"function.macro" = "error"

"tag" = "error"
"namespace" = "error"
"special" = "tertiary"

"markup.heading" = "primary"
# Opt-in marker for adaptive DiffText/DiffAdd/... heading backgrounds.
"markup.heading.adaptive" = "primary"
"markup.list" = "onSurfaceVariant"
"markup.bold" = { modifiers = ["bold"] }
"markup.italic" = { modifiers = ["italic"] }
"markup.strikethrough" = { fg = "onSurfaceVariant", modifiers = ["crossed_out"] }
"markup.link.url" = { fg = "tertiary", modifiers = ["underlined"] }
"markup.link.label" = "primary"
"markup.link.text" = "primary"
"markup.raw" = "tertiary"
"markup.quote" = "secondary"

"diff.plus" = "primary"
"diff.minus" = "error"
"diff.delta" = "tertiary"

# User interface. These mirror base16's Vim highlight roles.
"ui.text" = "onSurface"
"ui.text.inactive" = "outline"
"ui.text.directory" = "primary"
"ui.text.symlink" = "tertiary"
"ui.text.focus" = { fg = "onSurface", bg = "surfaceContainerHigh", modifiers = ["bold"] }

"ui.linenr" = "onSurfaceVariant"
"ui.linenr.selected" = "onSurfaceVariant"
"ui.gutter" = { fg = "outline" }
"ui.gutter.selected" = { fg = "outline", bg = "surfaceContainer" }

"ui.cursorline" = { bg = "surfaceContainer" }
"ui.cursorline.primary" = { bg = "surfaceContainer" }
"ui.cursorline.secondary" = { bg = "surfaceContainer" }

"ui.selection" = { fg = "onSurface", bg = "surfaceContainerHigh" }
"ui.selection.primary" = { fg = "onSurface", bg = "surfaceContainerHigh" }

"ui.cursor" = { fg = "background", bg = "onSurface" }
"ui.cursor.normal" = { fg = "background", bg = "onSurface" }
"ui.cursor.primary" = { fg = "background", bg = "onSurface" }
"ui.cursor.insert" = { fg = "background", bg = "onSurface" }
"ui.cursor.primary.insert" = { fg = "background", bg = "onSurface" }
"ui.cursor.select" = { fg = "background", bg = "onSurface" }
"ui.cursor.primary.select" = { fg = "background", bg = "onSurface" }
"ui.cursor.match" = { fg = "background", bg = "outline" }

"ui.highlight" = { fg = "surfaceContainer", bg = "secondary" }
"ui.highlight.frameline" = { bg = "secondaryContainer" }
# Brief flash over the range that was just yanked.
"ui.yank" = { fg = "onTertiary", bg = "tertiary" }

"ui.menu" = { fg = "onSurface", bg = "surfaceContainer" }
# Neovim PmenuSel: inverted light selection.
"ui.menu.selected" = { fg = "surfaceContainer", bg = "onSurface" }
"ui.menu.scroll" = { fg = "outline", bg = "surfaceContainerHigh" }

"ui.popup" = { fg = "onSurface", bg = "surface" }
"ui.popup.info" = { fg = "onSurface", bg = "background" }
# Neovim which-key / Float* roles.
"ui.popup.info.border" = { fg = "onSurface" }
"ui.popup.info.key" = { fg = "primary" }
"ui.popup.info.desc" = { fg = "error" }
"ui.popup.info.title" = { fg = "primary", modifiers = ["bold"] }
"ui.help" = { fg = "onSurface", bg = "surface" }
"ui.window" = { fg = "onSurface" }
"ui.background.separator" = { fg = "outline" }

"ui.statusline" = { fg = "onSurface", bg = "surfaceContainer" }
"ui.statusline.inactive" = { fg = "onSurfaceVariant", bg = "surfaceContainer" }
"ui.statusline.normal" = { fg = "background", bg = "primary", modifiers = ["bold"] }
"ui.statusline.insert" = { fg = "background", bg = "primary", modifiers = ["bold"] }
"ui.statusline.select" = { fg = "background", bg = "secondary", modifiers = ["bold"] }
"ui.statusline.command" = { fg = "background", bg = "tertiary", modifiers = ["bold"] }
"ui.statusline.search" = { fg = "background", bg = "secondary", modifiers = ["bold"] }
"ui.statusline.separator" = { fg = "outline", bg = "surfaceContainer" }

"ui.bufferline" = { fg = "onSurfaceVariant", bg = "surfaceContainerLowest" }
"ui.bufferline.active" = { fg = "onSurface", bg = "surfaceContainerHigh", modifiers = ["bold"] }
"ui.bufferline.background" = { bg = "surfaceContainerLowest" }
"ui.bufferline.indicator" = { fg = "primary" }
"ui.bufferline.modified" = { fg = "secondary" }

# Neovim Snacks dashboard roles.
"ui.dashboard.header" = { fg = "primary", modifiers = ["bold"] }
"ui.dashboard.icon" = { fg = "tertiary" }
"ui.dashboard.item" = { fg = "tertiary" }
"ui.dashboard.key" = { fg = "tertiary" }
"ui.dashboard.subtitle" = { fg = "onSurfaceVariant" }
"ui.dashboard.footer" = { fg = "primary" }

"ui.virtual" = "outline"
"ui.virtual.indent-guide" = "outlineVariant"
"ui.virtual.whitespace" = "outlineVariant"
"ui.virtual.ruler" = { bg = "surfaceContainer" }
"ui.virtual.inlay-hint" = { fg = "outline", modifiers = ["italic"] }
"ui.virtual.jump-label" = { fg = "primary", modifiers = ["bold"] }

"ui.debug" = { fg = "error" }
"ui.debug.breakpoint" = { fg = "tertiary" }

# Neovim Telescope / mini.pick roles.
"ui.picker.selected" = { fg = "onSurface", bg = "surfaceContainerHigh" }
"ui.picker.match" = { fg = "primary", modifiers = ["bold"] }
"ui.picker.border" = { fg = "outline" }
"ui.picker.title" = { fg = "background", bg = "primary", modifiers = ["bold"] }
"ui.picker.help" = { fg = "onSurfaceVariant" }
"ui.picker.header" = { fg = "onSurfaceVariant" }
"ui.picker.header.column" = { fg = "onSurfaceVariant" }
"ui.picker.header.column.active" = { fg = "primary" }

"diagnostic.hint" = { underline = { color = "tertiary", style = "curl" } }
"diagnostic.info" = { underline = { color = "primary", style = "curl" } }
"diagnostic.warning" = { underline = { color = "secondary", style = "curl" } }
"diagnostic.error" = { underline = { color = "error", style = "curl" } }
"diagnostic.spell" = { underline = { color = "error", style = "curl" } }

# Callout title and quote-bar colors. These mirror render-markdown.nvim's
# Diagnostic* highlight mapping without inheriting the curl underline used by
# LSP diagnostics.
"markup.callout.info" = { fg = "primary" }
"markup.callout.success" = { fg = "plus" }
"markup.callout.hint" = { fg = "tertiary" }
"markup.callout.warning" = { fg = "secondary" }
"markup.callout.error" = { fg = "error" }
"markup.callout.quote" = { fg = "tertiary" }
"diagnostic.unnecessary" = { modifiers = ["dim"] }
"diagnostic.deprecated" = { modifiers = ["crossed_out"] }

warning = "secondary"
info = "primary"
hint = "tertiary"
