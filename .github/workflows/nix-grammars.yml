name: |
  Update Nix grammar lock file
on:
  push:
    branches:
      - master
    paths:
      - languages.toml

permissions:
  contents: write

jobs:
  update-nix-grammars:
    name: Update Nix Grammars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      - name: Authenticate with Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: helix
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update Nix tree-sitter grammars
        run: |
          nix-shell --command "cargo xtask update-nix-grammar-sources"

      - name: Update Nix tree-sitter grammars
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          disable_globbing: true
          commit_message: |
            [Automated] Nix grammar lockfile update
          file_pattern: |
            nix/grammar-sources.json


